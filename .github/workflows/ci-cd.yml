name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: support-gpt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Install test and model dependencies
        run: uv sync --frozen --extra ml --extra test

      - name: Run tests
        run: uv run --no-sync pytest -q

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - name: Validate deployment settings
        shell: bash
        run: |
          set -euo pipefail
          : "${AWS_REGION:?Set the AWS_REGION repository variable}"
          : "${EC2_INSTANCE_ID:?Set the EC2_INSTANCE_ID repository variable}"
          if [[ ! "$EC2_INSTANCE_ID" =~ ^i-[0-9a-f]{8,17}$ ]]; then
            echo "::error::EC2_INSTANCE_ID is not a valid EC2 instance ID"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Start EC2 if needed and deploy through Systems Manager
        shell: bash
        run: |
          set -Eeuo pipefail

          started_by_workflow=false
          cleanup() {
            local result=$?
            trap - EXIT
            if [[ "$started_by_workflow" == true ]]; then
              echo "Stopping the EC2 instance started by this workflow."
              if ! aws ec2 stop-instances --instance-ids "$EC2_INSTANCE_ID" >/dev/null; then
                echo "::error::Could not stop EC2 instance $EC2_INSTANCE_ID"
                result=1
              fi
            fi
            exit "$result"
          }
          trap cleanup EXIT

          state="$(aws ec2 describe-instances \
            --instance-ids "$EC2_INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)"

          case "$state" in
            stopped)
              started_by_workflow=true
              aws ec2 start-instances --instance-ids "$EC2_INSTANCE_ID" >/dev/null
              ;;
            stopping)
              aws ec2 wait instance-stopped --instance-ids "$EC2_INSTANCE_ID"
              started_by_workflow=true
              aws ec2 start-instances --instance-ids "$EC2_INSTANCE_ID" >/dev/null
              ;;
            running)
              echo "EC2 is already running; it will be left running after deployment."
              ;;
            pending)
              echo "EC2 is already starting; it will be left running after deployment."
              ;;
            *)
              echo "::error::Cannot deploy while EC2 is in state '$state'"
              exit 1
              ;;
          esac

          aws ec2 wait instance-running --instance-ids "$EC2_INSTANCE_ID"
          aws ec2 wait instance-status-ok --instance-ids "$EC2_INSTANCE_ID"

          ping_status=Unknown
          for attempt in $(seq 1 60); do
            ping_status="$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$EC2_INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/dev/null || true)"
            if [[ "$ping_status" == "Online" ]]; then
              break
            fi
            sleep 10
          done

          if [[ "$ping_status" != "Online" ]]; then
            echo "::error::EC2 did not become available in Systems Manager"
            exit 1
          fi

          deploy_script=$(cat <<'REMOTE'
          set -Eeuo pipefail
          cd /home/ubuntu/Support-GPT
          git pull --ff-only origin main
          sudo docker compose up --build -d app

          for attempt in $(seq 1 180); do
            if health="$(sudo docker compose exec -T app curl -fsS --max-time 5 http://127.0.0.1:8000/api/health)"; then
              if printf '%s' "$health" | python3 -c 'import json,sys; data=json.load(sys.stdin); sys.exit(0 if data.get("status") == "healthy" and data.get("model_loaded") is True else 1)'; then
                printf '%s\n' "$health"
                exit 0
              fi
              printf 'App health check did not report a loaded model: %s\n' "$health" >&2
              sudo docker compose logs --tail=100 app >&2
              exit 1
            fi
            sleep 10
          done

          sudo docker compose logs --tail=100 app >&2
          echo "App did not become healthy with the model loaded." >&2
          exit 1
          REMOTE
          )
          encoded_script="$(printf '%s' "$deploy_script" | base64 -w0)"
          remote_command="sudo -u ubuntu -H bash -lc 'printf %s ${encoded_script} | base64 -d | bash'"
          parameters="$(jq -cn --arg command "$remote_command" '{commands: [$command]}')"
          command_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$parameters" \
            --timeout-seconds 3600 \
            --comment "Deploy Support-GPT ${GITHUB_SHA}" \
            --query 'Command.CommandId' \
            --output text)"

          command_status=Pending
          for attempt in $(seq 1 180); do
            command_status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || printf 'Pending')"
            case "$command_status" in
              Success|Failed|Cancelled|TimedOut|DeliveryTimedOut|ExecutionTimedOut|Undeliverable|Terminated)
                break
                ;;
            esac
            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query StandardOutputContent \
            --output text || true
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query StandardErrorContent \
            --output text || true

          if [[ "$command_status" != "Success" ]]; then
            echo "::error::EC2 deployment command finished with status '$command_status'"
            exit 1
          fi
